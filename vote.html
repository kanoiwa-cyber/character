<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>職員による院内投票｜加納岩総合病院 公式マスコットキャラクター総選挙</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#140203;color:#f4e6bf;line-height:1.9;
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Yu Gothic",Meiryo,sans-serif;}
  .card{max-width:560px;width:100%;text-align:center;background:linear-gradient(180deg,#fcf6e6,#f6ecce);color:#4a2c12;
    border:2px solid #c9a848;border-radius:18px;padding:36px 26px;box-shadow:0 14px 40px rgba(0,0,0,.5);}
  .sub{font-size:.82rem;font-weight:700;color:#7a5228;margin:0 0 6px;}
  h1{font-size:1.45rem;margin:0 0 14px;color:#9a1419;line-height:1.5;}
  .when{display:inline-block;margin:6px 0 16px;padding:10px 24px;border-radius:12px;border:2px dashed #c9a848;background:#fffdf7;font-weight:700;font-size:1.15rem;color:#9a1419;}
  p{margin:0 0 14px;font-size:.95rem;}
  a.btn{display:inline-block;margin-top:6px;padding:12px 30px;border-radius:999px;text-decoration:none;font-weight:700;color:#5a1015;
    background:linear-gradient(180deg,#f7e79a,#e3bf53 48%,#c39b2e);border:1.5px solid #b78f2d;}
</style>
</head>
<body>
  <main class="card">
    <p class="sub">加納岩総合病院　公式マスコットキャラクター総選挙</p>
    <h1>職員による院内投票</h1>
    <div class="when">10月8日（木）スタート</div>
    <p>ただいま準備中です。<br>社会医療法人加納岩の職員専用の投票ページです。<br>投票期間は 10月8日（木）〜10月20日（火）、1人1票です。</p>
    <p><a class="btn" href="./">総選挙のページへ戻る</a></p>
  </main>
</body>
</html>
